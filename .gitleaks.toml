# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "schlock gitleaks config"

# Load gitleaks' built-in rules. Without this a config file has no rules at all,
# and every scan reports "no leaks found" whatever the history contains.
[extend]
useDefault = true

[allowlist]
  description = "Test fixtures for secret scrubbing functionality"
  paths = [
    '''^tests/test_audit_scrubbing\.py$''',
  ]
  # The fake token in the tests/test_audit.py redaction fixtures, matched exactly.
  regexes = [
    '''^sk-live-abc123$''',
  ]
