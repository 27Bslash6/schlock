# Category: Credential Theft
# Risk Levels: BLOCKED
# Description: Commands that expose credentials and sensitive data

rules:
  - name: credential_exposure
    description: Exposing credentials is a security breach
    risk_level: BLOCKED
    patterns: ['cat\s+.{0,200}\.env', 'cat\s+.{0,200}id_rsa(?![^\s;|&]*\.pub(?:\s|$))', 'echo.{0,200}password']
    alternatives: ["Use secure secret management"]

  - name: extended_credential_exposure
    description: Accessing additional credential files beyond .env and id_rsa
    risk_level: BLOCKED
    patterns:
      # One pattern for every reader and every path, replacing eight cat-only ones.
      # `nl`, `tac`, `sort`, `cut`, `rev`, `sed` and `awk` print these files exactly
      # as `cat` does, and a glob names none of them. See ssh_key_exfiltration for
      # why this is keyed on the reader and not on the path alone.
      #
      # Each fixed filename ends at `(?![A-Za-z0-9])`, because a name that continues
      # with a letter or digit is a DIFFERENT file: `~/.kube/configmaps.yaml` and
      # `~/.aws/configure-notes.md` hold no secret, and BLOCKED is unrelaxable by
      # every preset. A SEPARATOR continuation is the same secret under another
      # name -- `credentials.bak`, `config-prod`, `.npmrc_old`, and `.docker/config`
      # whose real spelling is `config.json` -- so this is deliberately not the
      # whole-token boundary `(?![^\s;|&])`, which would unrate every backup and
      # every per-environment copy. Residual: a pluralised directory
      # (`~/.kube/configs/prod`) drops out of the fixed branch; the glob branch
      # below still rates `~/.kube/configs/*`.
      - '\b(?:cat|less|head|tail|more|strings|base64|base32|xxd|od|hexdump|nl|tac|sort|cut|rev|sed|awk|tr|paste|fold|expand|unexpand|column|pr|split|csplit|uniq|jq|yq)\b\s+[^;|&]*(?:\.aws/(?:credentials(?![A-Za-z0-9])|config(?![A-Za-z0-9])|(?![^\s;|&]*\.pub(?:\s|$))[^\s;|&]*[*?{])|\.docker/(?:config(?![A-Za-z0-9])|(?![^\s;|&]*\.pub(?:\s|$))[^\s;|&]*[*?{])|\.kube/(?:config(?![A-Za-z0-9])|(?![^\s;|&]*\.pub(?:\s|$))[^\s;|&]*[*?{])|\.npmrc(?![A-Za-z0-9])|\.netrc(?![A-Za-z0-9])|\.git-credentials(?![A-Za-z0-9])|\.pypirc(?![A-Za-z0-9]))'
      - '\b(cat|less|head|tail|more|strings|base64|xxd|od)\b\s+[^;|&]*\.ssh/(?:config(?![A-Za-z0-9])|known_hosts(?![A-Za-z0-9])|authorized_keys(?![A-Za-z0-9]))'
      # A credential NAME is only a credential when it is EXPANDED (`$GITHUB_TOKEN`,
      # `${PASSWORD}`) or ASSIGNED (`echo "API_KEY=abc" > .env`). Matching the bare
      # name denied ordinary prose outright -- `printf API_KEYBOARD`, `echo 'set your
      # API_KEY in .env'`, `echo PASSWORD reset instructions` -- at a level no preset
      # can relax. Both branches are needed: dropping the assignment branch unrated
      # writing a plaintext secret to a file, which nothing else in the rule set
      # catches for an uppercase name. Residual: a variable whose name merely
      # CONTAINS one of these (`$API_KEYBOARD`) still rates. Inside an expansion,
      # wide is the safe direction -- the cost is a prompt on a name nobody uses.
      - 'echo.{0,200}(?:\$\{?[A-Za-z0-9_]*(?:AWS_SECRET|API_KEY|TOKEN|PASSWORD|PRIVATE_KEY)|(?:AWS_SECRET|API_KEY|TOKEN|PASSWORD|PRIVATE_KEY)[A-Za-z0-9_]*=)'
      - 'printf.{0,200}(?:\$\{?[A-Za-z0-9_]*(?:AWS_SECRET|API_KEY|TOKEN|PASSWORD|PRIVATE_KEY)|(?:AWS_SECRET|API_KEY|TOKEN|PASSWORD|PRIVATE_KEY)[A-Za-z0-9_]*=)'
    alternatives: ["Use proper secret management tools", "Never expose credentials"]

  - name: hardcoded_secrets
    description: Prevent hardcoding secrets
    risk_level: BLOCKED
    patterns: ['export\s+AWS_SECRET', 'export\s+.{0,100}_KEY=', 'export\s+.{0,100}_TOKEN=', "echo.{0,200}['\"].{0,100}key.{0,100}['\"]\\s*>"]
    alternatives: ["Use environment files", "Use secrets manager", "Use vault"]

  # ============================================================
  # SSH Key Exfiltration (P0 Critical Gap)
  # ============================================================

  - name: ssh_key_exfiltration
    description: SSH private keys enable persistent unauthorized access
    risk_level: BLOCKED
    patterns:
      # Reading a private key with any tool that prints file contents.
      #
      # The old alternation stopped at (cat|less|head|tail|more|strings|base64|
      # xxd|od), so `nl`, `tac`, `sort`, `cut`, `rev`, `sed`, `awk` and `hexdump`
      # read a key unrated and a glob named no file at all. It was also unanchored,
      # so its `od` branch matched the tail of `chmod`: `chmod 600 ~/.ssh/id_rsa`,
      # the remedy ssh itself demands, was BLOCKED with no rule intending it.
      #
      # KEYING ON THE PATH ALONE -- guarded by a list of heads that cannot emit
      # contents -- WAS TRIED AND MEASURED AND REJECTED. Three reasons, each fatal:
      #   * the non-emitting set is unbounded (editors, `test`, `find`, `rm`,
      #     `touch`, `export`, every cloud CLI), and BLOCKED cannot be relaxed by
      #     any preset -- so a head missing from the list is a hard deny on
      #     everyday traffic. Measured: `vim ~/.npmrc`, `rm ~/.npmrc`,
      #     `test -f ~/.ssh/id_rsa`, `export KUBECONFIG=~/.kube/config`;
      #   * anchoring such a pattern at the segment start puts its match start
      #     outside any quote, which defeats the engine's string-literal
      #     suppression -- `echo 'add ~/.ssh/id_rsa to the agent'` was denied;
      #   * exempting a head blinds the whole segment, so `npm exec -- nl <key>`
      #     evaded anyway.
      #
      # So the reader list stays, and its incompleteness is the known, accepted
      # residual: a printing tool absent from it reads a key unrated. Adding a
      # name costs one token; the rejected alternative cost everyday commands.
      #
      # A reader NAME is not always a reader USE: `nl` is also a plausible
      # username (`chown nl <key>`, `ssh -l nl -i <key>`) and a plausible literal
      # argument (`printf ... nl <path>`), and this rule rates those. Guarding
      # them with a lookbehind on the preceding token was tried and REVERTED:
      # any such guard is reusable as an evasion, because an attacker controls
      # that token too. A quote guard would have unrated `foo 'x' cat <key>`,
      # and a short-flag guard would have unrated `env -i cat <key>`. A
      # contrived false positive is the lesser harm than a one-token bypass.
      #
      # `tee` is deliberately absent -- it WRITES its operand, and a BLOCKED read
      # rule over a write outranks the HIGH rule that owns it (`tee ~/.kube/config
      # < in` is file_truncation). `split` and `csplit` look similar and are NOT
      # writers: both take the input file as their operand and copy its contents
      # into shards, so `split -b 1m <key> /tmp/k` is a complete exfil.
      # Matching ANYWHERE in the segment rather than only at its start is what
      # keeps a wrapped reader covered -- `kubectl exec pod -- nl <key>`,
      # `docker exec c sort <key>`. Copy, archive, grep and openssl are below.
      - '\b(?:cat|less|head|tail|more|strings|base64|base32|xxd|od|hexdump|nl|tac|sort|cut|rev|sed|awk|tr|paste|fold|expand|unexpand|column|pr|split|csplit|uniq|jq|yq)\b\s+[^;|&]*\.ssh/(?:(?:id_[a-z0-9]+|identity)(?![a-z0-9])(?![^\s;|&]*\.pub(?:\s|$))|(?![^\s;|&]*\.pub(?:\s|$))[^\s;|&]*[*?{])'
      # Copying SSH keys
      - '(cp|mv|scp|rsync)\s+[^;|&]*\.ssh/(id_rsa|id_ed25519|id_ecdsa|id_dsa|identity)'
      - '(cp|mv|scp|rsync)\s+[^;|&]*\.ssh/id_[a-z0-9]+[^;|&]*/tmp/'
      # Archiving SSH keys
      - '(tar|zip|gzip)\s+[^;|&]*\.ssh/(id_rsa|id_ed25519|id_ecdsa|id_dsa|identity)'
      - '(tar|zip)\s+[^;|&]*\.ssh/[^;|&]*\|'
      # Grep/search through SSH keys (extraction)
      - 'grep\s+[^;|&]*\.ssh/(id_rsa|id_ed25519|id_ecdsa|id_dsa)'
      # OpenSSL operations on SSH keys
      - 'openssl\s+(rsa|ec|dsa|pkey)\s+[^;|&]*\.ssh/'
    alternatives:
      - "SSH keys should never be copied or transmitted"
      - "Use ssh-agent for key management"
      - "Generate new keys on target systems"

  - name: ssh_key_manipulation
    description: SSH key generation in suspicious locations or with weak settings
    risk_level: HIGH
    patterns:
      # Key generation to /tmp or /dev/shm (exfil staging)
      - 'ssh-keygen\s+[^;|&]*-f\s+/tmp/'
      - 'ssh-keygen\s+[^;|&]*-f\s+/dev/shm/'
      - 'ssh-keygen\s+[^;|&]*-f\s+/var/tmp/'
      # Key generation with empty passphrase
      - 'ssh-keygen\s+[^;|&]*-N\s+[''"][''"]'
      - 'ssh-keygen\s+[^;|&]*-N\s+""'
      # ssh-keyscan (reconnaissance)
      - 'ssh-keyscan\s+'
      # Extract public key from private (could indicate key theft)
      - 'ssh-keygen\s+[^;|&]*-y\s+[^;|&]*-f'
    alternatives:
      - "Generate keys in proper locations with passphrases"
      - "Use ssh-keyscan only for known hosts setup"

  - name: ssh_agent_abuse
    description: SSH agent manipulation can expose loaded keys
    risk_level: BLOCKED
    patterns:
      # List all loaded keys
      - 'ssh-add\s+-L'
      - 'ssh-add\s+--list'
      # SSH_AUTH_SOCK manipulation/exfil
      - 'echo\s+[^;|&]*SSH_AUTH_SOCK'
      - 'cat\s+[^;|&]*SSH_AUTH_SOCK'
      - 'export\s+SSH_AUTH_SOCK='
      # Agent forwarding abuse
      - 'ssh\s+[^;|&]*-A\s+[^;|&]*-o\s+ForwardAgent'
    alternatives:
      - "SSH agent keys are sensitive"
      - "Avoid agent forwarding to untrusted hosts"

  # ============================================================
  # GAP-002: Git Credential Theft
  # ============================================================

  - name: git_credential_theft
    description: Git credential helpers and configs contain stored passwords
    risk_level: BLOCKED
    patterns:
      # Git credential cache/helper commands
      - 'git\s+credential\s+(fill|approve|reject)'
      - 'git\s+credential-cache\s+exit'
      # Config extraction with credential info
      - 'git\s+config[^;|&]*(credential|insteadOf)'
      - 'git\s+config\s+--list[^;|&]*\|\s*grep'
      # Remote URL extraction (may contain tokens)
      - 'git\s+remote\s+-v\s*\|\s*grep\s+https'
      - 'git\s+config\s+--get\s+remote[^;|&]*url'
      # GitHub CLI tokens
      - '(cat|less|grep|strings)\s+[^;|&]*\.config/gh/hosts\.yml'
      - 'gh\s+auth\s+token'
    alternatives:
      - "Use credential helpers securely"
      - "Never expose git credentials"

  - name: ssh_known_hosts_manipulation
    description: Removing known hosts enables MITM attacks
    risk_level: HIGH
    patterns:
      # Remove all known hosts (wildcard)
      - 'ssh-keygen\s+-R\s+\*'
      - 'ssh-keygen\s+-R\s+\.'
      # Wipe known hosts file
      - '>\s*~?/?\.ssh/known_hosts'
      - 'rm\s+[^;|&]*\.ssh/known_hosts'
      - 'truncate\s+[^;|&]*\.ssh/known_hosts'
    alternatives:
      - "Removing known hosts weakens SSH security"
      - "Use ssh-keygen -R for specific hosts only"

  # ============================================================
  # GAP-003: Environment Variable Credential Extraction
  # ============================================================

  - name: environment_credential_extraction
    description: Environment variables often contain API keys and tokens
    risk_level: BLOCKED
    patterns:
      # Dump all environment variables
      - '^\s*env\s*$'
      - '^\s*printenv\s*$'
      - '^\s*export\s+-p\s*$'
      # Grep environment for credentials
      - '(env|printenv)\s*\|\s*grep'
      - 'export\s+-p\s*\|\s*grep'
      # Extract specific credential variables
      - 'echo\s+\$[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL)'
      - 'printenv\s+[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD|API)'
      # /proc environment extraction (other processes)
      - '(cat|strings|grep)\s+/proc/[0-9]+/environ'
    alternatives:
      - "Environment variables contain sensitive credentials"
      - "Use secure secret management instead"

  # ============================================================
  # GAP-005: Database Credential Files
  # ============================================================

  - name: database_credential_theft
    description: Database credential files and CLI histories contain passwords
    risk_level: BLOCKED
    patterns:
      # PostgreSQL
      - '(cat|less|grep|strings)\s+[^;|&]*\.pgpass'
      - '(cat|less|grep|strings)\s+[^;|&]*pg_service\.conf'
      # MySQL
      - '(cat|less|grep|strings)\s+[^;|&]*\.my\.cnf'
      - '(cat|less|grep|strings)\s+[^;|&]*\.mysql_history'
      # MongoDB
      - '(cat|less|grep|strings)\s+[^;|&]*\.mongorc\.js'
      - 'mongo[^;|&]*--eval[^;|&]*getUsers'
      # Redis
      - '(cat|less|grep|strings)\s+[^;|&]*\.rediscli_history'
      # SQLite credential extraction
      - 'sqlite3\s+[^;|&]*\.dump[^;|&]*password'
    alternatives:
      - "Database credentials should use secure storage"
      - "Never expose database configuration files"
