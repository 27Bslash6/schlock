      - 'echo(?:(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,200}\}|\$(?!\(|\{[^}\s]{0,200}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,200}\}|\$(?!\{[^}\s]{0,200}\})|''[^''\n]{0,200}''|"(?:[^"\\\n]|\\.){0,200}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,200}\}|\$(?!\{[^}\s]{0,200}\})|''[^''\n]{0,200}''|"(?:[^"\\\n]|\\.){0,200}"){0,200}\)){0,200}\)|`[^`\n]{0,200}`|[<>]&[0-9-]|&>|"(?:[^"\\\n]|\\.){0,200}"|''[^''\n]{0,200}''){0,200}\$\((?!(?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,200}\}|\$(?!\{[^}\s]{0,200}\})|''[^''\n]{0,200}''|"(?:[^"\\\n]|\\.){0,200}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,200}\}|\$(?!\{[^}\s]{0,200}\})|''[^''\n]{0,200}''|"(?:[^"\\\n]|\\.){0,200}"){0,200}\)){0,200}\))){0,3}(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,200}\}|\$(?!\(|\{[^}\s]{0,200}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,200}\}|\$(?!\{[^}\s]{0,200}\})|''[^''\n]{0,200}''|"(?:[^"\\\n]|\\.){0,200}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,200}\}|\$(?!\{[^}\s]{0,200}\})|''[^''\n]{0,200}''|"(?:[^"\\\n]|\\.){0,200}"){0,200}\)){0,200}\)|`[^`\n]{0,200}`|[<>]&[0-9-]|&>|"(?:[^"\\\n]|\\.){0,200}"|''[^''\n]{0,200}''){0,200}(?:''[^''\n]{0,100}key[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}key(?:[^"\\\n]|\\.){0,100}")(?:(?:(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,100}\}|\$(?!\(|\{[^}\s]{0,100}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\)|`[^`\n]{0,100}`|[<>]&[0-9-]|&>|"(?:[^"\\\n]|\\.){0,100}"|''[^''\n]{0,100}''){0,100}\$\((?!(?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\))){0,3}(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,100}\}|\$(?!\(|\{[^}\s]{0,100}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,10