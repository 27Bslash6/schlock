# Category: System Modification
# Risk Levels: BLOCKED, HIGH
# Description: Commands that modify critical system files and permissions

rules:
  # BLOCKED
  - name: protect_system_files
    description: Prevent modifications to system files
    risk_level: BLOCKED
    # Note: Using (?:^|[\s;&|]) instead of \b to avoid false positives on flags like --rm
    # Note: Using [^>] instead of . to avoid matching through redirects like 2>/dev/null
    patterns: ['(?:^|[\s;&|])(rm|mv|cp)\s+[^>]{0,200}/(etc|sys|proc|boot|sbin|dev)/', '>\s*/(etc|sys|proc|boot|sbin)/', '>\s*/dev/(?!null\b)', '(?:^|[\s;&|])rm\s+/sbin/init', '(?:^|[\s;&|])rm\s+/dev/', '(?:^|[\s;&|])chmod[^>]{0,100}/(sbin|dev|usr/lib/systemd)/', '(?:^|[\s;&|])chmod\s+000\s+/usr/', '(?:^|[\s;&|])mknod\s+/dev/']
    alternatives: ["Use configuration management tools", "Request system administrator access"]

  - name: recursive_permission_system_dirs
    description: Recursive permission changes on system directories destroy systems
    risk_level: BLOCKED
    # The two chown gaps are credential_exposure's one-command gap, so a later `ls /` or `cd /etc`
    # does not complete them. The find gap still crosses separators: find's own `\;` terminator
    # is a `;`, and bounding it would split multi-`-exec` chains.
    patterns: ['chmod\s+(-R|--recursive)\s+[0-7]{3}\s+(\/|\/etc|\/home|\/usr|\/var|\/opt|\/srv)(\s|$)', 'chmod\s+[0-7]{3}\s+(-R|--recursive)\s+(\/|\/etc|\/home|\/usr|\/var|\/opt|\/srv)(\s|$)', 'chown\s+(-R|--recursive)\s+(?:(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,100}\}|\$(?!\(|\{[^}\s]{0,100}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\)|`[^`\n]{0,100}`|[<>]&[0-9-]|&>|"(?:[^"\\\n]|\\.){0,100}"|''[^''\n]{0,100}''){0,100}\$\((?!(?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\))){0,3}(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,100}\}|\$(?!\(|\{[^}\s]{0,100}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\)|`[^`\n]{0,100}`|[<>]&[0-9-]|&>|"(?:[^"\\\n]|\\.){0,100}"|''[^''\n]{0,100}''){0,100}(?:"(?:[^"\\\n]|\\.){0,100}|''[^''\n]{0,100}|\$\{[^}\s]{0,100}|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}(?:\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100})?(?:"(?:[^"\\\n]|\\.){0,100}|''[^''\n]{0,100}|\$\{[^}\s]{0,100})?|`[^`\n]{0,100})?\s+(\/|\/etc|\/home|\/usr|\/var|\/opt|\/srv)(\s|$)', 'chown\s+(?:(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,100}\}|\$(?!\(|\{[^}\s]{0,100}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\)|`[^`\n]{0,100}`|[<>]&[0-9-]|&>|"(?:[^"\\\n]|\\.){0,100}"|''[^''\n]{0,100}''){0,100}\$\((?!(?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\))){0,3}(?:\\.|[^;|&\n''"\\$`]|\$\{[^}\s]{0,100}\}|\$(?!\(|\{[^}\s]{0,100}\})|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}\)|`[^`\n]{0,100}`|[<>]&[0-9-]|&>|"(?:[^"\\\n]|\\.){0,100}"|''[^''\n]{0,100}''){0,100}(?:"(?:[^"\\\n]|\\.){0,100}|''[^''\n]{0,100}|\$\{[^}\s]{0,100}|\$\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"|\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100}\)){0,100}(?:\((?:\\.|[^()\n''"\\$]|\$\{[^}\s]{0,100}\}|\$(?!\{[^}\s]{0,100}\})|''[^''\n]{0,100}''|"(?:[^"\\\n]|\\.){0,100}"){0,100})?(?:"(?:[^"\\\n]|\\.){0,100}|''[^''\n]{0,100}|\$\{[^}\s]{0,100})?|`[^`\n]{0,100})?\s+(-R|--recursive)\s+(\/|\/etc|\/home|\/usr|\/var|\/opt|\/srv)(\s|$)', 'find\s+/(|etc|home|usr|var)\s+.{0,200}-exec\s+(chmod|chown)']
    alternatives: ["NEVER change permissions recursively on system directories", "Target specific files only", "Use configuration management"]

  # HIGH
  - name: chmod_777
    description: Creates security vulnerability
    risk_level: HIGH
    patterns: ['chmod\s+777', 'chmod\s+-R\s+777', 'chmod\s+777.*-R', 'chmod\s+--recursive\s+777']
    alternatives: ["Use 755 or 644"]

  - name: recursive_permission_destruction
    description: Recursive permission changes can break systems
    risk_level: HIGH
    patterns: ['chmod\s+-R\s+[0-7]{3}', 'chmod\s+--recursive', 'chmod\s+[0-7]{3}.{0,50}-R', 'chown\s+-R', 'chown\s+--recursive', 'find\s+/.{0,200}-exec\s+(chmod|chown).{0,50}\{\}']
    alternatives: ["Target specific directories only", "Use configuration management", "Test in isolated environment"]

  - name: system_critical_writes
    description: Prevent writes to critical system locations
    risk_level: HIGH
    patterns: ['(?<!2)>\s*/proc/sys/', '(?<!2)>\s*/boot/', 'echo.{0,200}(?<!2)>\s*/dev/(?!null\b)', 'cat.{0,200}(?<!2)>\s*/dev/(?!null\b)']
    alternatives: ["Never write directly to system files", "Use proper system APIs", "Modify via configuration files"]

  - name: permission_manipulation_extended
    description: Additional permission and attribute manipulation commands
    risk_level: HIGH
    patterns: ['setfacl\s+.{0,100}-m\s+.{0,100}:rwx', 'setfacl\s+.{0,100}--modify', 'chattr\s+.{0,100}[-+]i', 'chattr\s+.{0,100}[-+]a', 'umask\s+0{1,3}[0-7]?', 'chmod\s+.{0,100}\+s', 'chmod\s+[24]7[0-7]{2}', 'chmod\s+.{0,100}a\+[rwx]+']
    alternatives: ["Use restrictive permissions", "Document permission changes", "Use configuration management"]

  - name: suid_sgid_creation
    description: SUID/SGID binaries enable privilege escalation
    risk_level: BLOCKED
    patterns:
      # Numeric SUID (4xxx) and SGID (2xxx) modes
      - '\bchmod\s+[42][0-7]{3}\s+'
      - '\bchmod\s+[67][0-7]{3}\s+'
      # Leading-zero octal (04755, 02755, 06755, 07755)
      - '\bchmod\s+0[4267][0-7]{3}\s+'
      # Symbolic SUID/SGID
      - '\bchmod\s+[^;|&]*u\+s'
      - '\bchmod\s+[^;|&]*g\+s'
      - '\bchmod\s+[^;|&]*\+s'
      # install command with SUID/SGID mode
      - '\binstall\s+[^;|&]*-m\s*0?[4267][0-7]{3}\b'
    alternatives:
      - "SUID/SGID binaries are a major privilege escalation vector"
      - "Use sudo with specific command restrictions instead"
      - "If required, audit the binary thoroughly first"

  - name: dotfile_persistence
    description: Modifying shell dotfiles enables persistent backdoors
    risk_level: HIGH
    patterns:
      # Shell RC files (append)
      - '>>\s*~/?\.(bashrc|bash_profile|zshrc|profile|login)'
      - '>>\s*\$HOME/\.(bashrc|bash_profile|zshrc|profile|login)'
      - '\becho\b[^;|&]*>>\s*~/?\.(bashrc|bash_profile|zshrc|profile)'
      - '\btee\s+(-a\s+)?~/?\.(bashrc|bash_profile|zshrc|profile)'
      # Shell RC files (overwrite) - (?<!>) ensures we don't double-match >>
      - '(?<!>)>\s*~/?\.(bashrc|bash_profile|zshrc|profile|login)'
      - '(?<!>)>\s*\$HOME/\.(bashrc|bash_profile|zshrc|profile|login)'
      # SSH authorized_keys (append)
      - '>>\s*~/?\.ssh/authorized_keys'
      - '>>\s*\$HOME/\.ssh/authorized_keys'
      - '\becho\b[^;|&]*>>\s*~/?\.ssh/authorized_keys'
      - '\btee\s+(-a\s+)?~/?\.ssh/authorized_keys'
      # SSH authorized_keys (overwrite)
      - '(?<!>)>\s*~/?\.ssh/authorized_keys'
      - '(?<!>)>\s*\$HOME/\.ssh/authorized_keys'
      # Environment files (append)
      - '>>\s*/etc/profile'
      - '>>\s*/etc/bash\.bashrc'
      - '>>\s*/etc/environment'
      # Environment files (overwrite) - (?<!>) ensures we don't double-match >>
      - '(?<!>)>\s*/etc/profile'
      - '(?<!>)>\s*/etc/bash\.bashrc'
      - '(?<!>)>\s*/etc/environment'
    alternatives:
      - "Dotfile modifications persist across sessions"
      - "Attackers use this for backdoor persistence"
      - "Use proper configuration management instead"

  - name: write_via_arg_persistence
    description: A command's output-file flag (sort/sdiff -o, find -fprint/-fprint0/-fprintf/-fls) writing to a sensitive system path enables persistence or privilege escalation
    risk_level: HIGH
    patterns:
      # sort/sdiff -o / --output (cluster ending in 'o', e.g. -o or -ro), or find -fprint/-fprint0/
      # -fprintf/-fls, space/'='-separated, optional quote, then a sensitive target. '-[a-zA-Z]*o'
      # catches combined short flags like -ro (-r + -o). (?(sortcmd)...) picks the flag set of
      # whichever command matched; it is named so a capture group added in front cannot re-aim it.
      # The target must follow the flag directly, so a sensitive find START path (find /etc/cron.d
      # -fprint list.txt) cannot match. The /etc/cron (and similar) prefixes intentionally match
      # anything beneath those dirs: writing under /etc at all is privileged.
      #
      # The command-to-flag span is a shell-word walk, NOT [^;|&\n]*. find's own syntax puts a `;`
      # inside one command (-exec ... \; or ';' or ";"), and a quoted operand can hold `|` or `&`
      # (-name 'a|b', sort -t '|'). A plain negated class stopped at any of them, so
      # `find . -exec true \; -fprint /etc/cron.d/x` read SAFE. The walk crosses an escaped
      # character or a whole quoted span and still stops at an UNQUOTED ; | & or newline, so it
      # cannot misattribute a flag from the next command. Its branches are disjoint (one parse per
      # input, no exponential backtracking): the next one or two characters pick one of backslash,
      # `$$` (the PID, so a `'` after it opens a PLAIN quote), `$'` (ANSI-C span, whose \' does not
      # close it), any other `$`, `"`, `'`, or anything else. The three `$` branches skip any
      # backslash-newline after the first `$`: bash deletes those before it reads the word, so
      # `$\<newline>$'` is `$$'` and pairs the same way.
      # Unlike extended_credential_exposure in 03_credential_theft.yaml, the single-quote branch
      # has NO lookbehind: bash opens a quote after a letter too (sort -t'|', -name a'|'b), and
      # here the lookbehind bought only that bypass. See #113.
      #
      # `find . -name '-fprint /etc/cron.d/x'` rates HIGH on purpose. The rules also run on the
      # quote-stripped reconstruction, where that match starts at the unquoted `find`; keep that
      # pass, because it is what sees through `"find"` and `f\ind`.
      - '\b(?:(?P<sortcmd>sort|sdiff)|find)\b(?:\\[\s\S]|[^;|&\n\x27"\\$]|\$(?:\\\n)*\$|\$(?!(?:\\\n)*[\x27$])|"(?:[^"\\]|\\[\s\S])*"|\$(?:\\\n)*\x27(?:[^\x27\\]|\\[\s\S])*\x27|\x27[^\x27]*\x27)*(?(sortcmd)(?:-[a-zA-Z]*o|--output)|\s-(?:fprint0?|fprintf|fls))[=\s]+["\x27]?(~/?\.(bashrc|bash_profile|zshrc|profile|login)|\$HOME/\.(bashrc|bash_profile|zshrc|profile|login)|\$\{HOME\}/\.(bashrc|bash_profile|zshrc|profile|login)|~/?\.ssh/authorized_keys|\$HOME/\.ssh/authorized_keys|\$\{HOME\}/\.ssh/authorized_keys|/root/|/etc/cron|/var/spool/cron|/etc/sudoers|/etc/profile|/etc/bash\.bashrc|/etc/environment|/etc/passwd|/etc/shadow|/etc/ld\.so|/etc/systemd|/(usr/)?lib/systemd)'
      # attached short form: -o<sensitive-path> or -ro<sensitive-path>
      - '\b(sort|sdiff)\b(?:\\[\s\S]|[^;|&\n\x27"\\$]|\$(?:\\\n)*\$|\$(?!(?:\\\n)*[\x27$])|"(?:[^"\\]|\\[\s\S])*"|\$(?:\\\n)*\x27(?:[^\x27\\]|\\[\s\S])*\x27|\x27[^\x27]*\x27)*-[a-zA-Z]*o["\x27]?(~/?\.(bashrc|bash_profile|zshrc|profile|login)|\$HOME/\.(bashrc|bash_profile|zshrc|profile|login)|\$\{HOME\}/\.(bashrc|bash_profile|zshrc|profile|login)|~/?\.ssh/authorized_keys|\$HOME/\.ssh/authorized_keys|\$\{HOME\}/\.ssh/authorized_keys|/root/|/etc/cron|/var/spool/cron|/etc/sudoers|/etc/profile|/etc/bash\.bashrc|/etc/environment|/etc/passwd|/etc/shadow|/etc/ld\.so|/etc/systemd|/(usr/)?lib/systemd)'
    alternatives:
      - "Writing to a system config/persistence path via a command's output-file flag is a backdoor vector"
      - "Write to a non-system path, or use proper configuration management"

  - name: system_service_modification
    description: System configuration and startup modification
    risk_level: HIGH
    patterns: ['systemctl\s+.{0,100}(disable|mask|stop).{0,100}(firewall|apparmor|selinux|ufw|iptables)', 'update-rc\.d\s+.{0,100}(disable|remove)', 'chkconfig\s+.{0,100}off', 'crontab\s+-r', 'at\s+.{0,100}(midnight|now)', 'echo.{0,200}>>\s*/etc/cron', 'modprobe\s+.{0,100}(ip_tables|nf_|xt_)', 'insmod\s+.{0,100}\.ko', 'sysctl\s+-w\s+.{0,100}=0']
    alternatives: ["Use configuration management", "Document system changes", "Test in isolation"]

  - name: process_manipulation
    description: Process and signal manipulation
    risk_level: MEDIUM
    patterns: ['kill\s+-9\s+1(?!\d)', 'killall\s+.{0,100}(systemd|init|kernel)', 'pkill\s+.{0,100}(systemd|init|kernel)', 'nice\s+-n\s+-20', 'renice\s+.{0,100}-20']
    alternatives: ["Target specific processes", "Use proper process management", "Avoid system processes"]

  - name: mount_operations
    description: Filesystem mounting with dangerous options
    risk_level: MEDIUM
    patterns: ['mount\s+.{0,100}-o\s+.{0,100}(rw|exec|suid)', 'mount\s+.{0,100}--bind\s+/\s+', 'mount\s+.{0,100}-t\s+.{0,100}/dev/', 'umount\s+-f', 'umount\s+/']
    alternatives: ["Use proper mount points", "Document mount operations", "Use read-only where possible"]

  - name: user_management
    description: User and group modifications
    risk_level: MEDIUM
    patterns: ['useradd\s+.{0,100}-G\s+.{0,100}(sudo|wheel|admin)', 'usermod\s+.{0,100}-a\s+-G\s+.{0,100}(sudo|wheel|admin)', 'passwd\s+-d', 'passwd\s+root', 'visudo', 'echo.{0,200}>>\s*/etc/sudoers', 'adduser\s+.{0,100}--disabled-password']
    alternatives: ["Use proper user management", "Document user changes", "Use LDAP/SSO"]

  # ============================================================
  # GAP-010: DNS Hijacking
  # ============================================================

  - name: dns_hijacking
    description: DNS manipulation enables phishing and C2 redirection
    risk_level: BLOCKED
    patterns:
      # /etc/hosts manipulation
      - '>\s*/etc/hosts'
      - '>>\s*/etc/hosts'
      - 'echo[^;|&]*>>\s*/etc/hosts'
      - 'cat[^;|&]*>\s*/etc/hosts'
      # /etc/resolv.conf manipulation
      - '>\s*/etc/resolv\.conf'
      - 'echo[^;|&]*>\s*/etc/resolv\.conf'
      - 'cat[^;|&]*>\s*/etc/resolv\.conf'
      # systemd-resolved manipulation
      - 'systemd-resolve\s+--set-dns'
      - 'resolvectl\s+dns'
      # macOS DNS manipulation
      - 'networksetup\s+-setdnsservers'
      - 'scutil\s+--set\s+DNS'
      # NetworkManager DNS
      - 'nmcli\s+[^;|&]*dns'
    alternatives:
      - "DNS changes redirect all network traffic"
      - "Attackers use DNS hijacking for credential phishing"
      - "Use proper network configuration tools"
