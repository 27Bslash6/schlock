# Category: Development Workflows
# Risk Levels: HIGH, MEDIUM, LOW, SAFE
# Description: Common development operations and package management

rules:
  # HIGH
  - name: git_force_push
    description: Force push overwrites remote history
    risk_level: HIGH
    # Every git global option displaces the subcommand: `git -C <dir> push --force`,
    # `git -c k=v push --force`, `git --no-pager push --force`. The group below absorbs
    # them generically rather than enumerating ~10 flags that git keeps adding to.
    # A flag's value is a shell WORD, so it may mix bare and quoted runs:
    # `-c user.name='Jane Doe'`. That is written as `B (Q B)*` -- a maximal bare run
    # that can only be followed by a quote -- so each input has exactly one parse;
    # two adjacent unanchored bare runs would make the enclosing group exponential.
    #
    # The option run is BOUNDED at 16, and that bound is load-bearing. These
    # patterns are unanchored so `sudo git push --force` still rates, which means
    # `git` inside an argument (`-C git`, a directory called git) starts another
    # candidate match. Unbounded, the group greedily consumed the whole remaining
    # suffix from every one of those starts before failing to find the subcommand:
    # O(n) starts x O(n) scan, measured at 162 ms on a 13 KB command against a
    # ~1 ms budget. Per-word parsing being unambiguous says nothing about this --
    # that property is about one word at one start position.
    #
    # Accepted residual: more than 16 global options in one invocation drops the
    # match. No real git command carries a third of that, and `main` dropped the
    # match on the FIRST global option, so this is strictly narrower than what it
    # replaces -- but it is a bound an attacker can pad past, and it is recorded
    # here rather than discovered later.
    #
    # The leading `(?!...)` refuses exactly ONE position: a terminating option
    # (-v, -h, --version, --help) as the FIRST word after `git`. There git prints
    # a version or a usage line and dispatches nothing -- measured against git
    # 2.43.0 over all 4 tokens x 8 subcommands, zero side effects in every cell.
    #
    # It is confined to position 1 because position 1 is the only argument that
    # cannot be another flag's VALUE. Refusing the token wherever it appears was
    # shipped once and reverted: several global options take a SEPARATE value, so
    # git consumes the refused token as that value and runs the subcommand anyway.
    # On the same binary, 16 of those 72 spellings dispatch -- including
    # `git --work-tree -v push --force` (remote ref moved) and
    # `git --namespace -v reset --hard` (working tree overwritten). An
    # adjacent-token refusal hands the attacker a one-word disarm for each.
    #
    # Deliberate residual: a terminating option after position 1 that git parses
    # as an OPTION rather than as a value (`git -c k=v -v push --force`, and
    # `git push --help` after the subcommand) still rates. git runs nothing there
    # either, so the verdict is an over-rating -- the safe direction, and the one
    # this rule takes whenever it cannot tell. Do NOT read that as licence to
    # refuse the token further right: in a VALUE slot the same token is consumed
    # as the value and the subcommand runs, which is the case above.
    patterns: ['git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+push[^;|&]{0,100}--force(?!-with-lease)', 'git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+push[^;|&]{0,100}\s-f(\s|$)']
    alternatives: ["Use --force-with-lease"]

  - name: git_hard_reset
    description: Hard reset destroys uncommitted work
    risk_level: HIGH
    patterns: ['git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+reset\s+--hard']
    alternatives: ["Use git stash first"]

  - name: git_blanket_staging
    description: Blanket staging sweeps build artifacts, secrets, and unrelated edits into the index
    risk_level: HIGH  # -> ask under balanced preset (MEDIUM would be a silent allow)
    patterns:
      # Two patterns so a blanket flag scoped to an explicit pathspec (git add -A src/foo.py)
      # is NOT flagged — the pathspec limits the sweep. Both keep the negative lookahead that
      # exempts interactive (-p/-i) and dry-run (-n): patch mode confirms every hunk and can't
      # stage untracked junk; dry runs mutate nothing.
      # 1. '.' is always the whole cwd — blanket wherever it stands as its own argument.
      - 'git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+add\b(?![^;|&]{0,100}\s(?:-p|-i|--patch|--interactive|-n|--dry-run)\b)[^;|&]{0,100}\s\.(\s|$)'
      # 2. --all/-A/-a with NO explicit pathspec: every argument must be a flag (\s+-...), so the
      #    command ends after the flags. A pathspec (git add -A src/foo.py) breaks the flag run
      #    and drops the match. The trailing (?:$|[;|&]) keeps chained sweeps (git add -A && ...).
      - 'git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+add\b(?![^;|&]{0,100}\s(?:-p|-i|--patch|--interactive|-n|--dry-run)\b)(?:\s+-[^\s;|&]+)*\s+(?:--all|-A|-a)(?:\s+-[^\s;|&]+)*\s*(?:$|[;|&])'
    alternatives:
      - "Stage explicit paths: git add <path> ..."
      - "Review first: git status --short"
      - "Stage interactively: git add -p"

  - name: database_drop
    description: Dropping databases is irreversible
    risk_level: HIGH
    patterns: ['DROP\s+DATABASE', 'DROP\s+TABLE']
    alternatives: ["Backup first"]

  - name: npm_global
    description: Global installs pollute system
    risk_level: HIGH
    patterns: ['npm\s+install\s+-g']
    alternatives: ["Use local dependencies"]

  - name: pip_system
    description: System Python installs break tools
    risk_level: HIGH
    patterns: ['pip\s+install\s+(?![^;|&]{0,100}--user)']
    alternatives: ["Use venv"]

  # ============================================================
  # Supply Chain Attacks (P0 Critical Gap)
  # ============================================================

  - name: package_install_untrusted_source
    description: Installing packages from URLs or git repos can execute malicious code
    risk_level: HIGH
    patterns:
      # npm from git/URLs
      - 'npm\s+install\s+[^;|&]*(git\+|github:|gitlab:|bitbucket:)'
      - 'npm\s+install\s+[^;|&]*https?://'
      - 'npm\s+i\s+[^;|&]*(git\+|github:|gitlab:)'
      # yarn from git/URLs
      - 'yarn\s+add\s+[^;|&]*(git\+|github:|gitlab:)'
      - 'yarn\s+add\s+[^;|&]*https?://'
      # pnpm from git/URLs
      - 'pnpm\s+(add|install)\s+[^;|&]*(git\+|github:)'
      # bun from git/URLs
      - 'bun\s+(add|install)\s+[^;|&]*(git\+|github:)'
      # pip from git/URLs
      - 'pip\s+install\s+[^;|&]*git\+https?://'
      - 'pip\s+install\s+[^;|&]*https?://[^;|&]*\.(whl|tar\.gz)'
      - 'pip\s+install\s+[^;|&]*--index-url\s+https?://'
      # pipx from URLs
      - 'pipx\s+install\s+[^;|&]*git\+https?://'
      # cargo from git
      - 'cargo\s+install\s+[^;|&]*--git\s+'
      - 'cargo\s+install\s+[^;|&]*--path\s+/tmp/'
      # gem from git/URLs
      - 'gem\s+install\s+[^;|&]*--source\s+https?://'
      - 'gem\s+install\s+[^;|&]*\.gem'
      # go install (always fetches)
      - 'go\s+install\s+[^;|&]*@'
      - 'go\s+get\s+'
      # deno from URLs
      - 'deno\s+install\s+[^;|&]*https?://'
      - 'deno\s+run\s+[^;|&]*https?://'
    alternatives:
      - "Verify package authenticity before installing"
      - "Use lockfiles and integrity checks"
      - "Review source code from unknown repositories"

  - name: build_from_source
    description: Building from source can execute arbitrary code
    risk_level: HIGH
    patterns:
      # make install (installs to system)
      - 'make\s+install'
      - 'make\s+[^;|&]*&&\s*make\s+install'
      # configure and install
      - '\./configure\s+[^;|&]*&&\s*make'
      # cmake install
      - 'cmake\s+--install'
      - 'cmake\s+[^;|&]*&&\s*make\s+install'
      # ninja install
      - 'ninja\s+install'
      # meson install
      - 'meson\s+install'
    alternatives:
      - "Use package managers when available"
      - "Review build scripts before running"
      - "Install to user directory with PREFIX"

  - name: homebrew_tap_install
    description: Installing from third-party Homebrew taps executes code from arbitrary GitHub repos
    risk_level: HIGH
    patterns:
      # brew install from tap (user/repo/formula format)
      # Character class includes dots for GitHub usernames like "user.org" (FINDING-003)
      - 'brew\s+install\s+[^;|&]*[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+'
      - 'brew\s+install\s+[^;|&]*--cask\s+[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+'
      # brew tap adds arbitrary GitHub repos as package sources
      - 'brew\s+tap\s+[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+'
    alternatives:
      - "Verify the tap repository before adding"
      - "Use official Homebrew formulae when available"
      - "Review the formula source code"

  - name: homebrew_install
    description: Homebrew install downloads and executes install scripts
    risk_level: MEDIUM
    patterns:
      # Regular brew install (official formulae)
      - 'brew\s+install\s+(?![^;|&]*[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+)'
      - 'brew\s+install\s+--cask\s+(?![^;|&]*[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+)'
      # brew upgrade can change binaries
      - 'brew\s+upgrade'
    alternatives:
      - "Review what will be installed with 'brew info'"
      - "Check formula source with 'brew cat'"

  - name: package_installation_system
    description: System-wide package installation
    risk_level: MEDIUM
    patterns: ['apt\s+install(?!\s+.{0,50}--dry-run)', 'apt-get\s+install(?!\s+.{0,50}--dry-run)', 'yum\s+install', 'dnf\s+install', 'zypper\s+(install|in)', 'pacman\s+-S', 'snap\s+install', 'flatpak\s+install']
    alternatives: ["Use containerized environments", "Document dependencies", "Use virtual environments"]

  - name: compiler_and_binary_execution
    description: Compiling and executing arbitrary binaries
    risk_level: MEDIUM
    patterns: ['gcc\s+.{0,100}\.c\s+.{0,50}&&\s*\./', 'g\+\+\s+.{0,100}\.cpp\s+.{0,50}&&\s*\./', 'javac\s+.{0,100}\.java\s+.{0,50}&&\s*java', 'go\s+run\s+', 'rustc\s+.{0,100}\.rs\s+.{0,50}&&\s*\./', 'make\s+&&\s*\./', 'cmake\s+.{0,100}&&\s*make\s+&&']
    alternatives: ["Review source code first", "Use sandboxed environments", "Scan for malware"]

  - name: aws_resource_deletion
    description: Prevent accidental AWS resource deletion
    risk_level: HIGH
    patterns: ['aws\s+.{0,100}\s+delete', 'aws\s+.{0,100}\s+terminate', 'terraform\s+destroy']
    alternatives: ["Use AWS console with MFA", "Create snapshot/backup first"]

  # MEDIUM
  - name: single_delete
    description: Deleting files without backup
    risk_level: MEDIUM
    patterns: ['^rm(?=\s+\S)\s+[^-]']
    alternatives: ["Backup first"]

  - name: git_push
    description: Pushing to remote
    risk_level: MEDIUM
    patterns: ['^git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+push\b']
    alternatives: ["Review with git log"]

  - name: git_merge
    description: Can create conflicts
    risk_level: MEDIUM
    patterns: ['git\s+merge']
    alternatives: ["Clean working directory"]

  - name: git_rebase
    description: Rewrites history
    risk_level: MEDIUM
    patterns: ['git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+rebase']
    alternatives: ["Only rebase local commits"]

  - name: chmod_exec
    description: Making files executable
    risk_level: MEDIUM
    patterns: ['chmod\s+\+x']
    alternatives: ["Ensure file is trusted"]

  - name: resource_intensive_operations
    description: Warn about resource-intensive operations
    risk_level: MEDIUM
    patterns: ['find\s+/\s+', 'grep\s+-r\s+.{0,100}\s+/', 'du\s+-h\s+/']
    alternatives: ["Limit search scope", "Use more specific paths"]

  # LOW
  - name: git_commit
    description: Committing changes
    risk_level: LOW
    patterns: ['^git(?!\s+-(?:v|h|-version|-help)(?![^\s;|&]))(?:\s+-[^\s;|&]+(?:\s+(?=[^\s;|&-])[^\s;|&''"]*(?:(?:''[^'']*''|"[^"]*")[^\s;|&''"]*)*)?){0,16}\s+commit']
    alternatives: []

  - name: npm_install
    description: Installing npm packages
    risk_level: LOW
    patterns: ['^npm\s+install']
    alternatives: []

  - name: pip_requirements
    description: Installing Python requirements
    risk_level: LOW
    patterns: ['pip.{0,50}-r\s+requirements']
    alternatives: []

  - name: yarn_install
    description: Installing yarn dependencies
    risk_level: LOW
    patterns: ['^yarn\s+install']
    alternatives: []

  - name: cargo_build
    description: Building Rust project
    risk_level: LOW
    patterns: ['^cargo\s+build']
    alternatives: []

  - name: make_build
    description: Running make
    risk_level: LOW
    patterns: ['^make\b']
    alternatives: []

  - name: docker_build
    description: Building Docker image
    risk_level: LOW
    patterns: ['^docker\s+build']
    alternatives: []

  - name: docker_run
    description: Running container
    risk_level: LOW
    patterns: ['^docker\s+run\s+(?!.{0,200}--privileged)']
    alternatives: []

  - name: curl_download
    description: Downloading with curl
    risk_level: LOW
    patterns: ['^curl\s+-[OL]']
    alternatives: []

  - name: wget_download
    description: Downloading with wget
    risk_level: LOW
    patterns: ['^wget\s+https']
    alternatives: []

  # SAFE
  - name: git_log
    description: Viewing git log
    risk_level: SAFE
    patterns: ['^git\s+log']
    alternatives: []

  - name: list_files
    description: Listing files
    risk_level: SAFE
    patterns: ['^ls\b']
    alternatives: []

  - name: pwd_cmd
    description: Print working directory
    risk_level: SAFE
    patterns: ['^pwd$']
    alternatives: []

  - name: simple_echo
    description: Echo simple text
    risk_level: SAFE
    patterns: ['^echo\s+[\w\s]+$']
    alternatives: []

  - name: cat_read
    description: Reading file contents
    risk_level: SAFE
    patterns: ['^cat\s+[\w/]+\.txt$']
    alternatives: []
