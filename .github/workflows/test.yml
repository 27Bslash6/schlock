name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        python-version: ['3.9', '3.14']
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint
      run: uv run ruff check . && uv run ruff format --check .

    - name: Test
      # Coverage on 3.14 only: 3.9 has no sys.monitoring, so tracing roughly doubles the leg.
      # 3.9 still runs the full suite.
      run: uv run pytest ${{ matrix.python-version == '3.14' && '--cov=src/schlock --cov-report=xml --cov-report=term' || '' }} --junitxml=junit.xml -o junit_family=legacy

    - name: Upload coverage
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        use_oidc: true
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./junit.xml
        report_type: test_results
        use_oidc: true
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

    - name: pip-audit
      run: uv export --no-hashes | uvx pip-audit -r /dev/stdin --ignore-vuln CVE-2026-4539  # pygments 2.19.2, no fix available (transitive dev dep via pytest)

    # Advisory OSV scan via the official pinned Docker action (runs ghcr.io image, no manual
    # binary download / no moving-target latest/ URL). continue-on-error keeps it non-blocking:
    # a finding or a GHCR/registry hiccup shows as a visible soft-failure, never a release blocker.
    # Pinned by commit SHA per this workflow's convention; Dependabot (github-actions ecosystem)
    # bumps the SHA + version comment automatically.
    - name: osv-scanner
      continue-on-error: true
      uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
      with:
        scan-args: |-
          --lockfile=uv.lock

    - name: semgrep
      # Pinned for reproducible runs. Bump manually — Dependabot can't see versions
      # embedded in a uvx run-string (unlike the SHA-pinned `uses:` actions above).
      run: uvx semgrep@1.165.0 scan --config p/security-audit --config p/python

    - name: Install gitleaks
      # The MIT-licensed CLI, pinned and checksum-verified. It needs no secret or license key,
      # so fork and Dependabot pull requests and merge queue runs scan exactly like push.
      # To bump: take the sha256 from the release's gitleaks_<version>_checksums.txt.
      env:
        VERSION: 8.30.1
        SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        cd "$RUNNER_TEMP"
        curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
        install -D -m 0755 gitleaks "$RUNNER_TEMP/bin/gitleaks"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: gitleaks
      # Every commit reachable from HEAD, with the rules in .gitleaks.toml. --redact keeps
      # secret values out of the log; --verbose still names the rule, file and commit.
      run: gitleaks git --redact --verbose --log-opts=HEAD
